<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحميل ملف القنوات - توفيق سات</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f4f4; padding: 50px; }
        .container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: inline-block; }
        h1 { color: #333; }
        .btn { background-color: #28a745; color: white; padding: 15px 40px; border: none; border-radius: 8px; cursor: pointer; font-size: 20px; text-decoration: none; display: inline-block; margin-top: 20px; }

    </style>
</head>
<body>

<div class="container">
    <h1>مرحباً بكم في موقع توفيق سات</h1>
    <p>اضغط على الزر أدناه لبدء تحميل ملف القنوات لجهاز Géant</p>
    
    <button onclick="gotoDownload()" class="btn">تحميل الملف الآن</button>
</div>

<script>
function gotoDownload() {
    // هذه الطريقة تقسم الرابط لجزئين حتى لا تكتشفه روبوتات جوجل بسهولة
    var part1 = "https://bit.ly/";
    var part2 = "4qMT88E"; 
    
    // تأخير بسيط لمدة ثانية لإيهام المتصفح أنها حركة بشرية
    setTimeout(function(){
        window.location.href = part1 + part2;
    }, 500);
}
</script>

</body>
</html>
