<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TECH NEWS ARABIC SAT</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --main-blue: #00d4ff; --net-red: #e50914; --dark-bg: #050a12; }
        body { background: var(--dark-bg); color: white; font-family: sans-serif; margin: 0; text-align: center; }
        
        /* تصميم كروت التطبيقات كروابط */
        .app-link { text-decoration: none; color: white; }
        .apps-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 15px; padding: 20px; }
        .app-item { background: #161b22; padding: 15px; border-radius: 15px; border: 1px solid #333; transition: 0.3s; }
        .app-item:hover { transform: scale(1.05); border-color: var(--main-blue); }

        /* زر تحميل القنوات */
        .btn-download { 
            background: #28a745; color: white; padding: 15px 30px; 
            border-radius: 50px; text-decoration: none; font-weight: bold;
            display: inline-block; margin: 20px; box-shadow: 0 4px 15px rgba(40, 167, 69, 0.4);
        }

        /* مكان الصور التي سترفعها */
        .user-images { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; padding: 20px; }
        .user-images img { width: 200px; border-radius: 10px; border: 2px solid var(--main-blue); }
    </style>
</head>
<body>

    <div style="background: var(--net-red); padding: 10px;">الجبهة الداخلية واعية 100%</div>

    <h1>📡 TECH NEWS ARABIC SAT</h1>

    <div style="margin: 30px 0;">
        <h3><i class="fas fa-file-download"></i> قسم تحميل ملفات القنوات 2026</h3>
        <a href="#" class="btn-download"><i class="fas fa-download"></i> تحميل ملف قنوات Nilesat</a>
    </div>

    <h3><i class="fas fa-play-circle"></i> تطبيقات المشاهدة</h3>
    <div class="apps-grid">
        <a href="https://www.netflix.com" class="app-link">
            <div class="app-item"><i class="fab fa-netflix" style="color:#e50914; font-size:30px;"></i>Netflix</div>
        </a>
        <a href="https://www.youtube.com" class="app-link">
            <div class="app-item"><i class="fab fa-youtube" style="color:#ff0000; font-size:30px;"></i>YouTube</div>
        </a>
        <a href="https://www.messenger.com" class="app-link">
            <div class="app-item"><i class="fab fa-facebook-messenger" style="color:#0084ff; font-size:30px;"></i>Messenger</div>
        </a>
    </div>

    <h3><i class="fas fa-images"></i> معرض الصور الخاص بي</h3>
    <div class="user-images">
        <img src="3108.jpg" alt="صورة توفيق">
        <p>قم برفع صورك على GitHub بنفس الاسم لتظهر هنا</p>
    </div>

</body>
</html>
