<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TECH NEWS ARABIC - Toufik Sat</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #e67e22; --accent: #27ae60; --bg: #0b0c0d; --card: #16181a; --red: #e74c3c; }
        
        /* منع أي اهتزاز أو حركة جانبية */
        html, body { 
            max-width: 100%;
            overflow-x: hidden;
            position: relative;
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            touch-action: pan-y;
        }

        .ticker-wrap { background: #c0392b; padding: 10px 0; border-bottom: 2px solid gold; overflow: hidden; }
        .ticker { display: inline-block; white-space: nowrap; animation: ticker 40s linear infinite; }
        @keyframes ticker { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        header { background: #000; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--accent); }
        #clock { color: var(--primary); font-weight: bold; font-family: monospace; }

        .search-section { padding: 20px 5%; text-align: center; }
        .search-box { width: 90%; max-width: 500px; padding: 12px; border-radius: 8px; border: 2px solid var(--primary); background: #111; color: white; outline: none; }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; padding: 10px 5%; }
        .card { background: var(--card); border-radius: 10px; border: 1px solid #333; overflow: hidden; }
        .card-header { background: #222; padding: 10px; text-align: center; color: var(--accent); font-weight: bold; }
        
        .device-list { height: 300px; overflow-y: auto; padding: 5px; }
        .device-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 10px; 
            border-bottom: 1px solid #222; 
        }

        /* لمبة الحالة */
        .status-dot { width: 10px; height: 10px; border-radius: 50%; margin-left: 8px; display: inline-block; }
        .available { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
        .not-available { background: var(--red); box-shadow: 0 0 5px var(--red); }

        .dl-btn { background: #333; color: white; padding: 5px 10px; border-radius: 4px; text-decoration: none; font-size: 0.8em; border: 1px solid #444; }
        .dl-btn:hover { background: var(--primary); }

        .sat-section { background: #000; padding: 30px 5%; text-align: center; }
        .sat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
        .sat-btn { background: #2980b9; color: white; padding: 15px 5px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 0.8em; }

        footer { background: #000; padding: 20px; text-align: center; font-size: 0.9em; color: #666; }
    </style>
</head>
<body>

<div class="ticker-wrap">
    <div class="ticker">📡 تحديثات فيفري 2026: الجبهة الداخلية الجزائرية واعية 100% .. الألوان الخضراء تعني وجود تحديث جديد .. تابعنا لجديد السيرفرات 📡</div>
</div>

<header>
    <div style="display:flex; align-items:center; gap:10px;">
        <img src="https://upload.wikimedia.org/wikipedia/commons/7/77/Flag_of_Algeria.svg" width="35">
        <div id="clock">00:00:00</div>
    </div>
    <div style="font-weight:bold;">TOUFIK SAT</div>
    <div class="social"><i class="fab fa-youtube"></i></div>
</header>

<div class="search-section">
    <input type="text" id="findBox" class="search-box" onkeyup="doSearch()" placeholder="ابحث عن جهازك...">
</div>

<div class="grid" id="mainGrid"></div>

<div class="sat-section">
    <h3 style="color:var(--primary)">📥 ملفات القنوات 2026</h3>
    <div class="sat-grid">
        <a href="https://www.flysat.com/en/satlist" target="_blank" class="sat-btn">Nilesat 7W</a>
        <a href="https://www.flysat.com/en/satlist" target="_blank" class="sat-btn">Astra 19.2E</a>
        <a href="https://www.flysat.com/en/satlist" target="_blank" class="sat-btn">Hotbird 13E</a>
        <a href="https://www.flysat.com/en/satlist" target="_blank" class="sat-btn">Badr 26E</a>
        <a href="https://www.flysat.com/en/satlist" target="_blank" class="sat-btn">Eutelsat 9E</a>
        <a href="https://www.flysat.com/en/satlist" target="_blank" class="sat-btn">Eutelsat 16E</a>
        <a href="https://www.flysat.com/en/satlist" target="_blank" class="sat-btn">Hispasat 30W</a>
        <a href="https://www.flysat.com/en/satlist" target="_blank" class="sat-btn">Thor 0.8W</a>
    </div>
</div>

<footer>
    <p>TECH NEWS ARABIC - توفيق سات © 2026</p>
</footer>

<script>
    // بيانات الأجهزة مع الحالة (Status)
    // green = متاح (أخضر) | red = غير متاح (أحمر)
    const inventory = [
        { 
            brand: "Géant", 
            url: "https://zinet-sat.com/index.php?route=product/category&path=110", 
            items: [
                {n: "GN-2500 Hybrid", s: "green"}, {n: "GN-RS8 Evo", s: "green"}, {n: "GN-750 EVO 4K", s: "green"},
                {n: "GN-MAMO Plus", s: "red"}, {n: "GN-CX300", s: "green"}, {n: "GN-OTT 750", s: "red"},
                {n: "GN-M4 Mini", s: "green"}, {n: "GN-2000 Hybrid", s: "green"}, {n: "GN-RS8 HD Plus", s: "red"}
            ] 
        },
        { 
            brand: "Starsat", 
            url: "https://swdw.net/", 
            items: [
                {n: "SR-2000 Extreme", s: "green"}, {n: "SR-T14 Extreme", s: "green"}, {n: "SR-4080 HD", s: "red"},
                {n: "SR-X1 Pro 4K", s: "red"}, {n: "SR-200 HD 4K", s: "green"}, {n: "SR-90000 Extreme", s: "green"}
            ] 
        },
        { 
            brand: "Icone", 
            url: "http://icone.bz/", 
            items: [
                {n: "IRON PRO 4K", s: "green"}, {n: "WEGOO 4K", s: "green"}, {n: "ICONE ICE", s: "red"},
                {n: "Z-ONE", s: "green"}, {n: "S-TWO", s: "green"}
            ] 
        }
        // يمكنك إضافة باقي الماركات بنفس الطريقة
    ];

    function draw() {
        const grid = document.getElementById('mainGrid');
        grid.innerHTML = inventory.map(g => `
            <div class="card">
                <div class="card-header">${g.brand}</div>
                <div class="device-list">
                    ${g.items.map(device => `
                        <div class="device-item">
                            <div>
                                <span class="status-dot ${device.s === 'green' ? 'available' : 'not-available'}"></span>
                                <span>${device.n}</span>
                            </div>
                            <a href="${g.url}" target="_blank" class="dl-btn">دخول</a>
                        </div>
                    `).join('')}
                </div>
            </div>
        `).join('');
    }

    function doSearch() {
        let val = document.getElementById('findBox').value.toLowerCase();
        let items = document.getElementsByClassName('device-item');
        for (let i = 0; i < items.length; i++) {
            items[i].style.display = items[i].innerText.toLowerCase().includes(val) ? "flex" : "none";
        }
    }

    setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString('en-GB'); }, 1000);
    draw();
</script>
</body>
</html>
