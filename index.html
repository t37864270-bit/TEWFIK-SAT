<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tewfik Sat Elite</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #050a12; color: white; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
        .header { background: linear-gradient(90deg, #e50914, #00d4ff); padding: 15px; border-radius: 15px; margin-bottom: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .awareness { background: #ff0000; color: white; padding: 5px; font-weight: bold; border-radius: 5px; margin-top: 5px; }
        
        /* قسم الأيقونات والخدمات */
        .apps-container { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin: 30px 0; }
        .app-card { background: #1a222d; padding: 20px; border-radius: 20px; width: 100px; transition: 0.3s; cursor: pointer; border: 1px solid #333; }
        .app-card:hover { transform: scale(1.1); border-color: #00d4ff; box-shadow: 0 0 20px #00d4ff; }
        .app-card i { font-size: 40px; margin-bottom: 10px; }
        
        .netflix { color: #e50914; } /* لون نتفليكس */
        .kids { color: #ffeb3b; }    /* لون الأطفال */
        .sat { color: #00d4ff; }     /* لون الستلايت */
        
        table { width: 100%; max-width: 600px; margin: 20px auto; border-collapse: collapse; background: #111; border-radius: 10px; overflow: hidden; }
        th, td { padding: 15px; border: 1px solid #222; }
        th { background: #333; color: #00d4ff; }
    </style>
</head>
<body>

    <div class="header">
        <h1>📡 TEWFIK-SAT 2026</h1>
        <div class="awareness">الجبهة الداخلية واعية 100%</div>
    </div>

    <h3><i class="fas fa-th-large"></i> التطبيقات والخدمات</h3>
    
    <div class="apps-container">
        <div class="app-card">
            <i class="fab fa-netflix netflix"></i>
            <div>Netflix</div>
        </div>

        <div class="app-card">
            <i class="fas fa-child kids"></i>
            <div>KIDS</div>
        </div>

        <div class="app-card">
            <i class="fab fa-youtube" style="color: #ff0000;"></i>
            <div>YouTube</div>
        </div>

        <div class="app-card">
            <i class="fas fa-server sat"></i>
            <div>Server</div>
        </div>
    </div>

    <h3><i class="fas fa-list"></i> جدول الترددات المحدث</h3>
    <table>
        <tr><th>القمر</th><th>التردد</th></tr>
        <tr><td>Nilesat</td><td>11747 V</td></tr>
        <tr><td>Astra</td><td>11856 V</td></tr>
    </table>

    <p>بواسطة: Samsung A9 📱</p>

</body>
</html>
