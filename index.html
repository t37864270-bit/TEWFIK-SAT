<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مركز تحميل توفيق سات</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #ff4500; --green: #2ecc71; --bg: #0b0c0d; }
        html, body { max-width: 100%; overflow-x: hidden; margin: 0; padding: 0; background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; }
        
        /* الهيدر والساعة */
        header { background: #000; padding: 20px; text-align: center; border-bottom: 4px solid var(--green); }
        #digital-clock { font-family: monospace; color: var(--primary); font-size: 2em; text-shadow: 0 0 10px var(--primary); }
        
        .social-icons { display: flex; justify-content: center; gap: 20px; margin-top: 15px; }
        .social-icons a { font-size: 26px; transition: 0.3s; }
        .fa-youtube { color: #ff0000; } .fa-facebook { color: #1877f2; } .fa-telegram { color: #0088cc; }

        /* قسم الأقمار - أزرار تحميل كبيرة */
        .sat-section { background: #111; padding: 30px 5%; text-align: center; border-bottom: 2px solid #333; }
        .sat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 15px; margin-top: 20px; }
        .download-card { 
            background: linear-gradient(145deg, #1e272e, #2f3640); 
            padding: 20px; border-radius: 15px; text-decoration: none; color: white;
            border: 2px solid #444; transition: 0.3s; display: block;
        }
        .download-card:hover { border-color: var(--green); transform: translateY(-5px); background: #222; }
        .download-card i { font-size: 2em; color: var(--green); margin-bottom: 10px; }
        .download-card span { display: block; font-weight: bold; font-size: 1.1em; }
        .dl-label { font-size: 0.7em; color: #aaa; margin-top: 5px; display: block; }

        /* الأجهزة */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; padding: 20px 5%; }
        .brand-box { background: #1a1c1f; border-radius: 12px; border: 1px solid #333; overflow: hidden; }
        .brand-title { background: #222; padding: 12px; text-align: center; color: var(--green); font-weight: bold; border-bottom: 2px solid var(--primary); }
        .row { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #25272b; }
        .status { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-left: 8px; }
        .green { background: var(--green); box-shadow: 0 0 8px var(--green); }
        .btn-dl { background: var(--primary); color: white; padding: 5px 10px; border-radius: 5px; text-decoration: none; font-size: 0.8em; }

        footer { padding: 30px; text-align: center; background: #000; color: #666; }
    </style>
</head>
<body>

<header>
    <div id="digital-clock">00:00:00</div>
    <h1 style="margin:5px 0;">TECH NEWS ARABIC</h1>
    <div class="social-icons">
        <a href="https://youtube.com/@toufiksat" target="_blank"><i class="fab fa-youtube"></i></a>
        <a href="#"><i class="fab fa-facebook"></i></a>
        <a href="#"><i class="fab fa-telegram"></i></a>
    </div>
</header>

<div class="sat-section">
    <h2 style="color: gold;">📥 مركز تحميل ملفات القنوات (روابط مباشرة)</h2>
    <p>قم بتحميل الملف المحدث لجهازك فوراً</p>
    <div class="sat-grid">
        <a href="#" class="download-card">
            <i class="fas fa-file-archive"></i>
            <span>Nilesat 7W</span>
            <span class="dl-label">اضغط للتحميل المباشر</span>
        </a>
        <a href="#" class="download-card">
            <i class="fas fa-file-archive"></i>
            <span>Astra 19.2E</span>
            <span class="dl-label">اضغط للتحميل المباشر</span>
        </a>
        <a href="#" class="download-card">
            <i class="fas fa-file-archive"></i>
            <span>Hotbird 13E</span>
            <span class="dl-label">اضغط للتحميل المباشر</span>
        </a>
        <a href="#" class="download-card">
            <i class="fas fa-file-archive"></i>
            <span>Badr Sat</span>
            <span class="dl-label">اضغط للتحميل المباشر</span>
        </a>
    </div>
</div>

<div class="grid" id="mainGrid"></div>

<footer>
    <p>توفيق سات - الجبهة الداخلية الجزائرية واعية 100% © 2026</p>
</footer>

<script>
    function updateClock() {
        document.getElementById('digital-clock').innerText = new Date().toLocaleTimeString('en-GB');
    }
    setInterval(updateClock, 1000);
    updateClock();

    const data = [
        { brand: "Géant", link: "https://zinet-sat.com/index.php?route=product/category&path=110", items: [{n:"GN-2500 Hybrid", s:"green"}, {n:"GN-750 EVO", s:"green"}] },
        { brand: "Starsat", link: "https://swdw.net/", items: [{n:"SR-2000 Extreme", s:"green"}, {n:"SR-T14", s:"green"}] },
        { brand: "Icone", link: "http://icone.bz/", items: [{n:"IRON PRO 4K", s:"green"}, {n:"WEGOO", s:"green"}] },
        { brand: "Condor", link: "https://www.condor.dz/", items: [{n:"Imago M710", s:"green"}] },
        { brand: "Echolink", link: "https://echolinkhd.com/", items: [{n:"Femto Pro 5", s:"green"}] },
        { brand: "Raylan", link: "http://www.raylan-mobi.com/", items: [{n:"RS-100 Pro", s:"green"}] }
    ];

    document.getElementById('mainGrid').innerHTML = data.map(b => `
        <div class="brand-box">
            <div class="brand-title">${b.brand}</div>
            ${b.items.map(i => `
                <div class="row">
                    <span><span class="status ${i.s}"></span> ${i.n}</span>
                    <a href="${b.link}" target="_blank" class="btn-dl">تحديث</a>
                </div>
            `).join('')}
        </div>
    `).join('');
</script>
</body>
</html>
