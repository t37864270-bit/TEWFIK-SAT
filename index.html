<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TECH NEWS ARABIC - Toufik Sat</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #e67e22; --bg: #0b0c0d; --card: #16181a; --green: #2ecc71; --red: #e74c3c; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; margin: 0; overflow-x: hidden; }
        
        /* شريط الأنباء المتحرك */
        .ticker-wrap { background: #c0392b; color: white; padding: 12px 0; overflow: hidden; white-space: nowrap; }
        .ticker { display: inline-block; animation: ticker 40s linear infinite; font-weight: bold; }
        @keyframes ticker { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        /* الهيدر */
        header { background: #000; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid #27ae60; position: sticky; top: 0; z-index: 1000; }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .dz-flag { width: 45px; filter: drop-shadow(0 0 5px #fff); }
        #clock { color: var(--primary); font-weight: bold; font-size: 1.3em; font-family: monospace; }
        .social-icons a { color: white; margin: 0 10px; font-size: 1.5em; transition: 0.3s; }
        .social-icons a:hover { color: var(--primary); }

        /* البحث */
        .search-container { padding: 30px 5%; text-align: center; }
        .search-box { width: 100%; max-width: 600px; padding: 15px 25px; border-radius: 30px; border: 2px solid var(--primary); background: #1a1a1a; color: white; font-size: 1.1em; outline: none; }

        /* الأجهزة */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 25px; padding: 0 5% 40px; }
        .card { background: var(--card); padding: 20px; border-radius: 15px; border: 1px solid #333; }
        .card h3 { color: #27ae60; border-bottom: 3px solid var(--primary); padding-bottom: 10px; text-align: center; margin-bottom: 15px; }
        .device-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 10px; border-bottom: 1px solid #222; cursor: pointer; }
        .device-item:hover { background: #222; color: var(--primary); }
        .dot { width: 12px; height: 12px; border-radius: 50%; }
        .green { background: var(--green); box-shadow: 0 0 8px var(--green); }
        .red { background: var(--red); }

        /* الأقمار */
        .sat-section { background: #000; margin: 20px 5%; padding: 30px; border-radius: 20px; border: 2px solid #27ae60; text-align: center; }
        .sat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; margin-top: 20px; }
        .btn-sat { background: #2980b9; color: white; padding: 15px; text-decoration: none; border-radius: 10px; font-weight: bold; }

        footer { background: #000; padding: 40px; text-align: center; border-top: 5px solid #27ae60; }
    </style>
</head>
<body>

<div class="ticker-wrap">
    <div class="ticker">📡 تحديثات فيفري 2026 متوفرة الآن .. عودة سيرفرات Forever و Apollo للعمل .. تابعوا TECH NEWS ARABIC 📡</div>
</div>

<header>
    <div class="header-left">
        <img src="https://upload.wikimedia.org/wikipedia/commons/7/77/Flag_of_Algeria.svg" class="dz-flag">
        <div id="clock">00:00:00</div>
    </div>
    <h2>TECH NEWS ARABIC</h2>
    <div class="social-icons">
        <a href="#"><i class="fab fa-facebook"></i></a>
        <a href="#"><i class="fab fa-youtube"></i></a>
        <a href="#"><i class="fab fa-telegram"></i></a>
    </div>
</header>

<div class="search-container">
    <input type="text" id="searchInput" class="search-box" onkeyup="filterDevices()" placeholder="ابحث عن اسم جهازك...">
</div>

<div class="grid" id="mainGrid"></div>

<div class="sat-section">
    <h3>تحميل ملفات الأقمار 2026</h3>
    <div class="sat-grid">
        <a href="#" class="btn-sat">Nilesat 7W</a>
        <a href="#" class="btn-sat">Astra 19.2E</a>
        <a href="#" class="btn-sat">Hotbird 13E</a>
        <a href="#" class="btn-sat">Badr 26E</a>
    </div>
</div>

<footer>
    <p>TECH NEWS ARABIC - Toufik Sat © 2026</p>
</footer>

<script>
    // 1. القائمة البرمجية: هنا تضع كل أجهزتك (يمكنك إضافة ماركات وأجهزة بلا نهاية هنا)
    const myInventory = [
        {
            brand: "Géant",
            devices: [{ name: "GN-RS8 HD Plus", status: "green" },

                { name: "GN-2500 HD Hybrid", status: "green" },
                { name: "GN-RS8 Evo", status: "green" },
                { name: "GN-750 EVO 4K", status: "green" },
                { name: "GN-MAMO Plus", status: "green" },
                { name: "GN-OTT 750 Allure", status: "red" }
            ]
        },
        {
            brand: "Starsat",
            devices: [
                { name: "SR-2000 Extreme", status: "green" },
                { name: "SR-T14 Extreme", status: "green" },
                { name: "SR-4080 HD", status: "red" }
            ]
        },
        {
            brand: "Icone",
            devices: [
                { name: "IRON PRO 4K", status: "green" },
                { name: "WEGOO 4K", status: "green" }
            ]
        }
        // أضف أي ماركة جديدة هنا بفتح قوس { } جديد
    ];

    // 2. وظيفة بناء الموقع تلقائياً من القائمة أعلاه
    function buildSite() {
        const grid = document.getElementById('mainGrid');
        grid.innerHTML = myInventory.map(item => `
            <div class="card">
                <h3>${item.brand}</h3>
                <div class="list">
                    ${item.devices.map(d => `
                        <div class="device-item" onclick="alert('تحميل تحديث: ${d.name}')">
                            <span>${d.name}</span>
                            <span class="dot ${d.status}"></span>
                        </div>
                    `).join('')}
                </div>
            </div>
        `).join('');
    }

    // 3. محرك البحث الذكي
    function filterDevices() {
        let input = document.getElementById('searchInput').value.toLowerCase();
        let items = document.getElementsByClassName('device-item');
        for (let i = 0; i < items.length; i++) {
            items[i].style.display = items[i].innerText.toLowerCase().includes(input) ? "flex" : "none";
        }
    }

    // 4. الساعة
    setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString('en-GB'); }, 1000);

    // تشغيل البناء عند الفتح
    buildSite();
</script>
</body>
</html>
