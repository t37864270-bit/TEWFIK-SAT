<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DZ Receivers Pro Hub 2026</title>
    <style>
        :root {
            --primary: #f39c12; /* لون ذهبي تقني */
            --dark-bg: #0f0f0f;
            --card-bg: #1a1a1b;
            --text: #e0e0e0;
            --accent-green: #2ecc71;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--dark-bg);
            color: var(--text);
            margin: 0;
            line-height: 1.6;
        }

        /* رأس الصفحة */
        header {
            background: #000;
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .lang-switcher select {
            background: var(--primary);
            color: #000;
            border: none;
            padding: 7px 12px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }

        .container { padding: 40px 5%; max-width: 1200px; margin: auto; }

        h1 { text-align: center; color: var(--primary); font-size: 2.2rem; }
        .subtitle { text-align: center; color: #888; margin-bottom: 40px; }

        /* شبكة الأجهزة المحدثة */
        .devices-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #333;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card:hover {
            border-color: var(--primary);
            box-shadow: 0 5px 15px rgba(243, 156, 18, 0.2);
        }

        .brand-header {
            font-size: 1.4rem;
            color: var(--primary);
            margin-bottom: 10px;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
        }

        .device-list { font-size: 0.9rem; color: #bbb; min-height: 50px; }

        .update-box {
            background: #222;
            padding: 10px;
            border-radius: 8px;
            margin-top: 15px;
            text-align: center;
        }

        .btn-download {
            display: block;
            background: var(--accent-green);
            color: white;
            padding: 10px;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 10px;
            font-weight: bold;
            font-size: 0.85rem;
        }

        footer {
            background: #000;
            text-align: center;
            padding: 40px;
            margin-top: 60px;
            border-top: 1px solid #333;
        }
    </style>
</head>

    <div class="lang-switcher">

            <option value="ar">العربية</option>
            <option value="fr">Français</option>
            <option value="en">English</option>
