<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TECH NEWS ARABIC SAT</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --main-blue: #00d4ff; --net-red: #e50914; --dark-bg: #050a12; }
        body { background: var(--dark-bg); color: white; font-family: 'Segoe UI', Tahoma; margin: 0; padding: 0; text-align: center; }
        
        /* شريط الأخبار المتحرك */
        .ticker { background: var(--net-red); color: white; padding: 10px; overflow: hidden; white-space: nowrap; font-weight: bold; }
        .ticker span { display: inline-block; padding-left: 100%; animation: ticker 20s linear infinite; }
        @keyframes ticker { 0% { transform: translate(0, 0); } 100% { transform: translate(100%, 0); } }

        /* الهيدر والساعة */
        .header { background: linear-gradient(135deg, #1a222d, #00d4ff); padding: 30px; border-bottom: 3px solid var(--main-blue); }
        #clock { font-size: 1.5em; background: rgba(0,0,0,0.5); display: inline-block; padding: 10px 20px; border-radius: 50px; margin-top: 10px; border: 1px solid var(--main-blue); }

        /* خانة البحث */
        .search-box { margin: 20px auto; max-width: 500px; position: relative; }
        .search-box input { width: 90%; padding: 12px; border-radius: 25px; border: none; outline: none; font-size: 16px; }
        .search-box i { position: absolute; left: 30px; top: 12px; color: #888; }

        /* قسم التطبيقات */
        .apps-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 15px; padding: 20px; max-width: 1000px; margin: auto; }
        .app-item { background: #161b22; padding: 15px; border-radius: 15px; border: 1px solid #333; transition: 0.3s; }
        .app-item:hover { transform: translateY(-10px); border-color: var(--main-blue); box-shadow: 0 0 15px var(--main-blue); }
        .app-item i { font-size: 35px; margin-bottom: 10px; display: block; }

        /* طرق الدفع وتواصل معنا */
        .footer-sections { display: flex; flex-wrap: wrap; justify-content: space-around; background: #0d1117; padding: 40px 20px; margin-top: 40px; }
        .pay-methods i { font-size: 40px; margin: 10px; color: #aaa; }
        .social-links a { color: var(--main-blue); font-size: 30px; margin: 0 15px; text-decoration: none; }
        
        .awareness-tag { color: #ff0000; font-weight: bold; font-size: 1.2em; border: 2px solid red; display: inline-block; padding: 5px 15px; border-radius: 5px; margin: 20px; }
    </style>
</head>
<body onload="updateClock()">

    <div class="ticker">
        <span>أهلاً بكم في TECH NEWS ARABIC SAT .. الجبهة الداخلية واعية 100% .. تابعوا أحدث ترددات 2026 حصرياً هنا .. </span>
    </div>

    <div class="header">
        <h1><i class="fas fa-satellite"></i> TECH NEWS ARABIC SAT</h1>
        <div id="clock">00:00:00</div>
    </div>

    <div class="search-box">
        <input type="text" placeholder="ابحث عن تردد أو قناة...">
        <i class="fas fa-search"></i>
    </div>

    <div class="awareness-tag">الجبهة الداخلية واعية 100%</div>

    <div class="apps-grid">
        <div class="app-item"><i class="fab fa-netflix" style="color:#e50914"></i>Netflix</div>
        <div class="app-item"><i class="fas fa-child" style="color:#ffeb3b"></i>الأطفال</div>
        <div class="app-item"><i class="fab fa-youtube" style="color:#ff0000"></i>YouTube</div>
        <div class="app-item"><i class="fas fa-tv" style="color:#00ff00"></i>IPTV</div>
        <div class="app-item"><i class="fas fa-server" style="color:#00d4ff"></i>Server</div>
        <div class="app-item"><i class="fas fa-microchip" style="color:#ffffff"></i>Software</div>
    </div>

    <div class="footer-sections">
        <div class="pay-section">
            <h4><i class="fas fa-credit-card"></i> طرق الدفع المتاحة</h4>
            <div class="pay-methods">
                <i class="fab fa-cc-visa"></i>
                <i class="fab fa-cc-mastercard"></i>
                <i class="fab fa-paypal"></i>
                <i class="fas fa-university"></i>
            </div>
        </div>
        <div class="social-section">
            <h4><i class="fas fa-share-alt"></i> تواصل معنا</h4>
            <div class="social-links">
                <a href="#"><i class="fab fa-facebook"></i></a>
                <a href="#"><i class="fab fa-telegram"></i></a>
                <a href="#"><i class="fab fa-whatsapp"></i></a>
            </div>
        </div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('ar-SA');
            setTimeout(updateClock, 1000);
        }
    </script>
</body>
</html>
